<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build your catalogue · Koot</title>
<meta name="description" content="Build a Koot catalogue with only the products you choose and save it as a PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/koot.css">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body>
<main id="main">
<section class="cb">
  <div class="wrap">
    <div class="no-print">
      <span class="eyebrow" data-ar="أنشئ كتالوجك">Catalogue builder</span>
      <h1 style="font-size:clamp(2.4rem,5.6vw,4.4rem)" data-ar="كتالوجك، <em>بمنتجاتك فقط.</em>">Your catalogue, <em>your products only.</em></h1>
      <div class="cb-bar">
        <div class="fgroup"><button class="chip" type="button" data-mode="sel" aria-pressed="true"></button><button class="chip" type="button" data-mode="all" aria-pressed="false" data-ar="المجموعة الكاملة">Full range</button></div>
        <label><span data-ar="معدّ لـ (اختياري)">Prepared for (optional)</span><input id="who" placeholder="Company name" data-ar-ph="اسم الشركة" autocomplete="organization"></label>
        <button class="btn btn--orange" type="button" id="print"><span data-ar="حفظ كملف PDF">Save as PDF</span></button>
      </div>
      <p class="pill-note" style="margin:-12px 0 24px" data-ar="في نافذة الطباعة اختر «حفظ كملف PDF» كوجهة.">In the print window, choose "Save as PDF" as the destination.</p>
    </div>
    <article class="cdoc">
      <header class="cd-cover">
        <img src="assets/img/koot-logo.webp" alt="Koot, food that matters">
        <h1 class="cd-title"></h1>
        <p class="cd-meta"></p>
      </header>
      <div class="cd-body"></div>
      <footer class="cd-foot"><span>Koot Expert General Trading LLC · Dubai, UAE</span><span>sales@koot.ae · www.koot.ae</span></footer>
    </article>
  </div>
</section>
</main>
<script src="assets/products.js"></script>
<script src="assets/data.js"></script>
<script src="assets/art.js"></script>
<script src="assets/koot.js"></script>
<script src="assets/extras.js"></script>
<script>
(function () {
  var K = KOOT, $ = function (s) { return document.querySelector(s); }, mode = 'sel';
  function T(en, ar) { return K.lang === 'ar' ? ar : en; }
  function nm(x) { return K.lang === 'ar' ? x.ar : x.en; }
  function sel() { try { return JSON.parse(localStorage.getItem('koot-sel') || '[]'); } catch (e) { return []; } }
  function rows() {
    var out = [];
    if (mode === 'sel') sel().forEach(function (s) { var k = K.products[s.id]; if (!k) return; var p = K.byId(k.pid); out.push({ p: p, v: p.variants.find(function (v) { return v.sku === s.id; }), q: s }); });
    else K.list.forEach(function (p) { p.variants.forEach(function (v) { out.push({ p: p, v: v }); }); });
    return out;
  }
  function draw() {
    var n = sel().length;
    if (!n && mode === 'sel') mode = 'all';
    document.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.mode === mode); });
    var sb = $('[data-mode=sel]'); sb.textContent = T('My selection (' + n + ')', 'اختياراتي (' + n + ')'); sb.disabled = !n; sb.style.opacity = n ? 1 : .45;
    var rs = rows(), who = $('#who').value.trim();
    $('.cd-title').textContent = mode === 'sel' ? T('Product selection', 'المنتجات المختارة') : T('Product catalogue', 'كتالوج المنتجات');
    $('.cd-meta').textContent = (who ? T('Prepared for ', 'معدّ لـ ') + who + ' · ' : '') + new Date().toLocaleDateString(K.lang === 'ar' ? 'ar-AE' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) + ' · ' + T(rs.length + ' items', rs.length + ' صنف');
    var html = '';
    K.cats.forEach(function (c) {
      var list = rs.filter(function (r) { return r.p.cat === c.id; }); if (!list.length) return;
      html += '<h2 class="cd-cat">' + nm(c) + '</h2>' + list.map(function (r) {
        var v = r.v, units = { cartons: T('cartons', 'كراتين'), pallets: T('pallets', 'منصات'), containers: T('containers', 'حاويات') };
        return '<div class="cd-row"><img src="' + K.src(v.image, 600) + '" alt=""><div><strong>' + nm(r.p) + '</strong><small>' + (v.label ? (K.lang === 'ar' ? v.label_ar : v.label) + ' · ' : '') + '<bdi dir="ltr">' + v.sku + '</bdi></small>' + (r.q ? '<span class="q">' + T('Requested: ', 'المطلوب: ') + r.q.qty + ' ' + units[r.q.unit] + '</span>' : '') + '</div>' +
          '<div><small>' + T('Pack', 'العبوة') + '</small><bdi dir="ltr">' + (K.lang === 'ar' ? v.pack_ar : v.pack) + '</bdi><small>' + K.tr(v.packaging) + ' · <bdi dir="ltr">' + v.net_carton_kg + ' / ' + v.gross_carton_kg + ' kg</bdi></small></div>' +
          '<div><small>' + T('Origin', 'المنشأ') + '</small>' + K.tr(v.origin) + '<small>' + K.tr(v.storage) + ' · ' + K.shelf(r.p) + '</small></div></div>';
      }).join('');
    });
    $('.cd-body').innerHTML = html;
  }
  document.addEventListener('click', function (e) {
    var m = e.target.closest('[data-mode]');
    if (m) { mode = m.dataset.mode; draw(); }
    else if (e.target.closest('#print')) window.print();
    else if (e.target.closest('[data-q],[data-rm]')) setTimeout(draw, 0);
  });
  document.addEventListener('change', function () { setTimeout(draw, 0); });
  $('#who').addEventListener('input', draw);
  document.addEventListener('koot:lang', draw);
  K.boot(); draw();
})();
</script>
</body>
</html>
