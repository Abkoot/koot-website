<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Products · Koot</title>
<meta name="description" content="The Koot range: frozen French fries, vegetables, fruits and pulps, seafood, sauces and pickles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/koot.css">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body>
<main id="main">
<section class="chero" id="chero">
  <div class="wrap">
    <p class="crumbs"><a href="index.html" data-ar="الرئيسية">Home</a> / <a href="category.html" data-ar="المنتجات">Products</a><span class="crumb-c"></span></p>
    <div class="chero-grid">
      <div>
        <span class="eyebrow" data-ar="منتجات كوت">The Koot range</span>
        <h1 class="c-title"></h1>
        <p class="lead c-line"></p>
      </div>
      <div class="chero-art" aria-hidden="true"><div class="fan"></div></div>
    </div>
  </div>
</section>

<div class="filters">
  <div class="wrap">
    <div class="cat-tabs" role="tablist" aria-label="Categories"></div>
    <div class="fgroup" data-f="pack"></div>
    <div class="fgroup" data-f="origin"></div>
    <label class="find"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg><input type="search" id="q" placeholder="Search products" data-ar-ph="ابحث عن منتج" aria-label="Search products"></label>
    <span class="count" aria-live="polite"></span>
  </div>
</div>

<section class="sec" style="padding-top:clamp(28px,4vw,56px)">
  <div class="wrap"><div class="grid"></div></div>
</section>

<section class="sec sec--green">
  <div class="wrap cta" data-reveal>
    <h2 data-ar="تبحث عن شيء <em>محدد؟</em>">Looking for something <em>specific?</em></h2>
    <p class="lead" style="text-align:center" data-ar="أضف المنتجات التي تهمّك وأرسل طلباً واحداً. فريقنا يساعدك في الاختيار والأسعار والكميات.">Add the products you are considering and send one enquiry. Our team will help with selection, pricing and quantities.</p>
    <p class="pill" data-sel-summary></p>
    <button class="btn btn--orange" type="button" data-tray-open data-ar="افتح اختياراتك">Open your selection</button>
  </div>
</section>
</main>

<div class="cmpbar"><span class="cmp-n"></span><button class="btn btn--sm btn--orange" type="button" data-cmp-open data-ar="قارن">Compare</button><button class="btn btn--sm btn--ghost" type="button" data-cmp-clear data-ar="مسح">Clear</button></div>
<dialog class="cmp" aria-label="Compare products"><div class="cmp-in"></div></dialog>

<script src="assets/products.js"></script>
<script src="assets/data.js"></script>
<script src="assets/art.js"></script>
<script src="assets/koot.js"></script>
<script src="assets/extras.js"></script>
<script>
(function () {
  var K = KOOT, $ = function (s) { return document.querySelector(s); };
  var params = new URLSearchParams(location.search);
  var st = { cat: K.cat(params.get('cat')) ? params.get('cat') : 'all', pack: 'all', origin: 'all', q: '' }, cmp = [];
  var grid = $('.grid'), bar = $('.cmpbar'), dlg = $('dialog.cmp');
  function ar() { return K.lang === 'ar'; }
  function nm(p) { return ar() ? p.ar : p.en; }
  function inCat() { return K.list.filter(function (p) { return st.cat === 'all' || p.cat === st.cat; }); }
  function match(p) {
    if (st.pack !== 'all' && K.weights(p).indexOf(st.pack) < 0) return false;
    if (st.origin !== 'all' && p.origin.indexOf(st.origin) < 0) return false;
    if (st.q) { var h = (p.en + ' ' + p.ar + ' ' + p.variants.map(function (v) { return v.sku + ' ' + v.desc_en; }).join(' ')).toLowerCase(); if (h.indexOf(st.q.toLowerCase()) < 0) return false; }
    return true;
  }
  function wlabel(w) { return ar() ? w.replace(' kg', ' كجم').replace(' g', ' جم') : w; }
  function drawTabs() {
    var all = [{ id: 'all', en: 'All products', ar: 'كل المنتجات' }].concat(K.cats);
    $('.cat-tabs').innerHTML = all.map(function (c) {
      return '<button class="chip" type="button" role="tab" data-cat="' + c.id + '" aria-pressed="' + (c.id === st.cat) + '">' + nm(c) + '</button>';
    }).join('');
  }
  function drawFilters() {
    var base = inCat(), packs = [], orgs = [];
    base.forEach(function (p) { K.weights(p).forEach(function (w) { if (packs.indexOf(w) < 0) packs.push(w); }); p.origin.forEach(function (o) { if (orgs.indexOf(o) < 0) orgs.push(o); }); });
    function group(el, label, vals, key, fmt) {
      el.hidden = vals.length < 2;
      el.innerHTML = '<span>' + label + '</span><button class="chip" type="button" data-fk="' + key + '" data-v="all" aria-pressed="' + (st[key] === 'all') + '">' + (ar() ? 'الكل' : 'All') + '</button>' +
        vals.map(function (v) { return '<button class="chip" type="button" data-fk="' + key + '" data-v="' + v + '" aria-pressed="' + (st[key] === v) + '">' + fmt(v) + '</button>'; }).join('');
    }
    if (packs.indexOf(st.pack) < 0) st.pack = 'all';
    if (orgs.indexOf(st.origin) < 0) st.origin = 'all';
    group($('[data-f=pack]'), ar() ? 'حجم العبوة' : 'Pack size', packs, 'pack', wlabel);
    group($('[data-f=origin]'), ar() ? 'المنشأ' : 'Origin', orgs, 'origin', K.tr);
  }
  function drawHero() {
    var c = st.cat === 'all' ? null : K.cat(st.cat), base = inCat();
    $('#chero').style.setProperty('--accent', c ? c.accent : '#F3B21F');
    $('.c-title').innerHTML = c ? nm(c) : (ar() ? 'مجموعة <em>كوت</em>' : 'The <em>Koot</em> range');
    $('.c-line').textContent = c ? K.t(c.line) : (ar() ? 'بطاطس وخضروات وفواكه ومأكولات بحرية وصلصات ومخللات، بعبوات جاهزة للتجزئة وخدمات الطعام والاستيراد.' : 'Fries, vegetables, fruit, seafood, sauces and pickles, in packs made for retail, foodservice and import.');
    $('.crumb-c').innerHTML = c ? ' / <span>' + nm(c) + '</span>' : '';
    var pick = st.cat === 'all' ? ['fries-9', 'broccoli', 'shrimp-tail-off'].map(K.byId) : [base[0], base[Math.floor(base.length / 2)], base[base.length - 1]].filter(function (p, i, a) { return a.indexOf(p) === i; });
    if (pick.length === 2) pick = [pick[0], pick[1]];
    $('.fan').innerHTML = pick.map(function (p) { return '<img src="' + K.src(p.image, 600) + '" alt="">'; }).join('');
    document.title = (c ? nm(c) : (ar() ? 'المنتجات' : 'Products')) + ' · Koot';
  }
  function draw() {
    var items = inCat().filter(match);
    grid.innerHTML = items.map(function (p, i) {
      var multi = p.variants.length > 1, v = p.variants[0], c = K.cat(p.cat);
      var sub = multi ? (p.variants[0].label ? (ar() ? p.variants.length + ' خيارات' : p.variants.length + ' options') : (ar() ? 'متوفر بعدة أحجام' : 'Multiple pack sizes')) : '';
      return '<article class="pcard" style="--accent:' + c.accent + '" data-reveal="' + (i % 3 + 1) + '"><a class="pcard-art" href="product.html?p=' + p.id + '" aria-label="' + p.en + '"><img src="' + K.src(p.image, 600) + '" alt="' + p.en + '" loading="lazy" width="450" height="600" style="view-transition-name:pk-' + p.id + '"></a>' +
        '<div class="pcard-body"><h3><a href="product.html?p=' + p.id + '">' + nm(p) + '</a></h3><div class="meta">' + K.packs(p).map(function (x) { return '<span dir="ltr">' + x + '</span>'; }).join('') + '<span>' + p.origin.map(K.tr).join(' · ') + '</span></div>' + (sub ? '<p class="pcard-sub">' + sub + '</p>' : '') + '</div>' +
        '<div class="pcard-act"><a class="btn btn--sm" href="product.html?p=' + p.id + '">' + (ar() ? 'التفاصيل' : 'View details') + '</a><button class="btn btn--sm btn--ghost" type="button" data-add="' + v.sku + '"></button>' +
        '<label class="cmp-check"><input type="checkbox" data-cmp="' + p.id + '"' + (cmp.indexOf(p.id) > -1 ? ' checked' : '') + '>' + (ar() ? 'قارن' : 'Compare') + '</label></div></article>';
    }).join('') || '<p class="empty">' + (ar() ? 'لا توجد منتجات مطابقة.' : 'No products match these filters.') + '</p>';
    $('.count').textContent = ar() ? items.length + ' منتج' : items.length + (items.length === 1 ? ' product' : ' products');
    K.refresh(); K.reveal(grid);
  }
  function drawBar() {
    bar.classList.toggle('on', cmp.length > 0);
    $('.cmp-n').textContent = ar() ? cmp.length + ' من 3 للمقارنة' : cmp.length + ' of 3 selected';
    var b = $('[data-cmp-open]'); b.disabled = cmp.length < 2; b.style.opacity = cmp.length < 2 ? .45 : 1;
  }
  function row(label, fn, ps) { return '<tr><th>' + label + '</th>' + ps.map(function (p) { return '<td>' + fn(p) + '</td>'; }).join('') + '</tr>'; }
  function drawCmp() {
    var ps = cmp.map(K.byId), L = ar();
    var opts = function (p) { return p.variants.length > 1 && p.variants[0].label ? p.variants.map(function (v) { return L ? v.label_ar : v.label; }).join('<br>') : '—'; };
    dlg.querySelector('.cmp-in').innerHTML = '<div class="cmp-top"><h3>' + (L ? 'قارن بين المنتجات' : 'Compare products') + '</h3><button class="btn btn--sm btn--ghost" type="button" data-cmp-close>' + (L ? 'إغلاق' : 'Close') + '</button></div>' +
      '<div class="cmp-scroll"><table><thead><tr><th></th>' + ps.map(function (p) { return '<th><div class="c-art"><img src="' + K.src(p.image, 600) + '" alt="" style="height:100%;width:auto;mix-blend-mode:multiply"></div>' + nm(p) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      row(L ? 'أحجام العبوات' : 'Pack sizes', function (p) { return '<span dir="ltr">' + K.packs(p).join('<br>') + '</span>'; }, ps) +
      row(L ? 'الخيارات' : 'Options', opts, ps) +
      row(L ? 'المنشأ' : 'Origin', function (p) { return p.origin.map(K.tr).join(' · '); }, ps) +
      row(L ? 'التخزين' : 'Storage', function (p) { return K.tr(p.storage); }, ps) +
      row(L ? 'مدة الصلاحية' : 'Shelf life', K.shelf, ps) +
      row(L ? 'وزن الكرتون (صافي / إجمالي)' : 'Carton (net / gross)', function (p) { var v = p.variants[0]; return '<span dir="ltr">' + v.net_carton_kg + ' / ' + v.gross_carton_kg + ' kg</span>'; }, ps) +
      '<tr><th></th>' + ps.map(function (p) { return '<td><a class="btn btn--sm" href="product.html?p=' + p.id + '">' + (L ? 'التفاصيل' : 'View details') + '</a></td>'; }).join('') + '</tr></tbody></table></div>';
  }
  function sync() { var u = new URL(location.href); st.cat === 'all' ? u.searchParams.delete('cat') : u.searchParams.set('cat', st.cat); history.replaceState(null, '', u); }
  function all() { drawTabs(); drawFilters(); drawHero(); draw(); drawBar(); }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-cat],[data-fk]');
    if (t && t.closest('.filters')) {
      if (t.dataset.cat) { st.cat = t.dataset.cat; st.pack = st.origin = 'all'; cmp = []; sync(); all(); }
      else { st[t.dataset.fk] = t.dataset.v; drawFilters(); draw(); }
      return;
    }
    if (e.target.closest('[data-cmp-open]')) { drawCmp(); dlg.showModal(); }
    else if (e.target.closest('[data-cmp-close]') || e.target === dlg) dlg.close();
    else if (e.target.closest('[data-cmp-clear]')) { cmp = []; draw(); drawBar(); }
  });
  $('#q').addEventListener('input', function (e) { st.q = e.target.value.trim(); draw(); });
  grid.addEventListener('change', function (e) {
    var id = e.target.dataset.cmp; if (!id) return;
    if (e.target.checked) {
      var p = K.byId(id), first = cmp.length && K.byId(cmp[0]);
      if (cmp.length >= 3 || (first && first.cat !== p.cat)) { e.target.checked = false; var t = $('.toast'); t.textContent = cmp.length >= 3 ? (ar() ? 'يمكن مقارنة 3 منتجات كحد أقصى.' : 'You can compare up to 3 products.') : (ar() ? 'قارن منتجات من الفئة نفسها.' : 'Compare products from the same category.'); t.classList.add('on'); setTimeout(function () { t.classList.remove('on'); }, 2600); return; }
      cmp.push(id);
    } else cmp = cmp.filter(function (x) { return x !== id; });
    drawBar();
  });
  document.addEventListener('koot:lang', all);
  K.boot(); all();
  if (location.hash === '#search') $('#q').focus();
})();
</script>
</body>
</html>
