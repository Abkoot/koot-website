<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Products · Koot</title>
<meta name="description" content="The Koot range: frozen French fries, vegetables, fruits and pulps, seafood, sauces and pickles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/koot.css">
<link rel="icon" href="assets/img/favicon.png" type="image/png"><link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
</head>
<body>
<main id="main">
<section class="chero" id="chero">
  <div class="wrap">
    <p class="crumbs"><a href="index.html" data-ar="الرئيسية">Home</a> / <a href="category.html" data-ar="المنتجات">Products</a><span class="crumb-c"></span></p>
    <div class="chero-grid">
      <div>
        <span class="eyebrow" data-ar="منتجات كوت">The Koot range</span>
        <h1 class="c-title"></h1>
        <p class="lead c-line"></p>
        <div class="btns c-cta"></div>
      </div>
      <div class="chero-art" aria-hidden="true"><div class="fan"></div></div>
    </div>
  </div>
</section>

<div class="filters">
  <div class="wrap">
    <div class="cat-tabs" role="tablist" aria-label="Categories"></div>
    <label class="find"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg><input type="search" id="q" placeholder="Search products" data-ar-ph="ابحث عن منتج" aria-label="Search products"></label>
    <span class="count" aria-live="polite"></span>
  </div>
</div>

<section class="sec" style="padding-top:clamp(28px,4vw,56px)">
  <div class="wrap"><div class="grid"></div></div>
</section>

<section class="sec sec--green">
  <div class="wrap cta" data-reveal>
    <h2 data-ar="تبحث عن <em>مورّد؟</em>">Looking for a <em>supplier?</em></h2>
    <p class="lead" style="text-align:center" data-ar="أخبرنا بما تحتاجه والكميات ووجهة الشحن، وسيرد عليك فريق المبيعات.">Tell us what you need, rough volumes and where it ships to. Our sales team will reply.</p>
    <p class="pill" data-sel-summary></p>
    <a class="btn btn--orange" href="rfq.html" data-ar="تواصل مع فريق المبيعات">Contact our sales team</a>
  </div>
</section>
</main>


<script src="assets/products.js"></script>
<script src="assets/data.js"></script>
<script src="assets/art.js"></script>
<script src="assets/koot.js"></script>
<script src="assets/extras.js"></script>
<script>
(function () {
  var K = KOOT, $ = function (s) { return document.querySelector(s); };
  var params = new URLSearchParams(location.search);
  var st = { cat: K.cat(params.get('cat')) ? params.get('cat') : 'all', q: '' };
  var grid = $('.grid');
  function ar() { return K.lang === 'ar'; }
  function nm(p) { return ar() ? p.ar : p.en; }
  function inCat() { return K.list.filter(function (p) { return st.cat === 'all' || p.cat === st.cat; }); }
  function match(p) {
    if (!st.q) return true;
    var h = (p.en + ' ' + p.ar + ' ' + p.variants.map(function (v) { return v.sku + ' ' + v.desc_en; }).join(' ')).toLowerCase();
    return h.indexOf(st.q.toLowerCase()) > -1;
  }
  function drawTabs() {
    var all = [{ id: 'all', en: 'All products', ar: 'كل المنتجات' }].concat(K.cats);
    $('.cat-tabs').innerHTML = all.map(function (c) {
      return '<button class="chip" type="button" role="tab" data-cat="' + c.id + '" aria-pressed="' + (c.id === st.cat) + '">' + nm(c) + '</button>';
    }).join('');
  }
  function drawHero() {
    var c = st.cat === 'all' ? null : K.cat(st.cat), base = inCat();
    $('#chero').style.setProperty('--accent', c ? c.accent : '#F3B21F');
    $('.c-title').innerHTML = c ? nm(c) : (ar() ? 'مجموعة <em>كوت</em>' : 'The <em>Koot</em> range');
    $('.c-line').textContent = c ? K.t(c.line) : (ar() ? 'بطاطس وخضروات وفواكه ومأكولات بحرية وصلصات ومخللات، كلها كوت.' : 'Fries, vegetables, fruit, seafood, sauces and pickles. All Koot.');
    $('.c-cta').innerHTML = c ? '<button class="btn btn--orange" type="button" data-addcat="' + c.id + '"></button>' : '<a class="btn btn--orange" href="rfq.html">' + (ar() ? 'تواصل مع فريق المبيعات' : 'Contact our sales team') + '</a>';
    $('.crumb-c').innerHTML = c ? ' / <span>' + nm(c) + '</span>' : '';
    var pick = st.cat === 'all' ? ['fries-9', 'broccoli', 'shrimp-tail-off'].map(K.byId) : [base[0], base[Math.floor(base.length / 2)], base[base.length - 1]].filter(function (p, i, a) { return a.indexOf(p) === i; });
    $('.fan').innerHTML = pick.map(function (p) { return '<img src="' + K.src(p.image, 600) + '" alt="">'; }).join('');
    document.title = (c ? nm(c) : (ar() ? 'المنتجات' : 'Products')) + ' · Koot';
  }
  function details(p) {
    var L = ar(), seen = [];
    p.variants.forEach(function (v) { var d = L ? v.desc_ar : v.desc_en; if (d && seen.indexOf(d) < 0) seen.push(d); });
    var rows = p.variants.map(function (v) {
      return '<tr><th dir="ltr">' + v.sku + '</th><td>' + (v.label ? (L ? v.label_ar : v.label) + ' · ' : '') + '<span dir="ltr">' + (L ? v.pack_ar : v.pack) + '</span> · <span dir="ltr">' + v.net_carton_kg + ' / ' + v.gross_carton_kg + ' kg</span></td></tr>';
    }).join('');
    return '<details class="pdet"><summary>' + (L ? 'الوصف' : 'Description') + '</summary><ul>' + seen.map(function (d) { return '<li>' + d + '</li>'; }).join('') + '</ul></details>' +
      '<details class="pdet"><summary>' + (L ? 'المواصفات' : 'Specifications') + '</summary><table>' + rows +
      '<tr><th>' + (L ? 'المنشأ' : 'Origin') + '</th><td>' + p.origin.map(K.tr).join(' · ') + '</td></tr><tr><th>' + (L ? 'التخزين' : 'Storage') + '</th><td>' + K.tr(p.storage) + '</td></tr><tr><th>' + (L ? 'الصلاحية' : 'Shelf life') + '</th><td>' + K.shelf(p) + '</td></tr></table></details>';
  }
  function draw() {
    var items = inCat().filter(match);
    grid.innerHTML = items.map(function (p, i) {
      var c = K.cat(p.cat);
      return '<article class="pcard" style="--accent:' + c.accent + '" data-reveal="' + (i % 3 + 1) + '"><a class="pcard-art" href="product.html?p=' + p.id + '" aria-label="' + p.en + '"><img src="' + K.src(p.image, 600) + '" alt="' + p.en + '" loading="lazy" width="450" height="600" style="view-transition-name:pk-' + p.id + '"></a>' +
        '<div class="pcard-body"><h3><a href="product.html?p=' + p.id + '">' + nm(p) + '</a></h3><div class="meta">' + K.packs(p).map(function (x) { return '<span dir="ltr">' + x + '</span>'; }).join('') + '</div>' + details(p) + '</div></article>';
    }).join('') || '<p class="empty">' + (ar() ? 'لا توجد منتجات مطابقة.' : 'No products match.') + '</p>';
    $('.count').textContent = ar() ? items.length + ' منتج' : items.length + (items.length === 1 ? ' product' : ' products');
    K.refresh(); K.reveal(grid);
  }
  function sync() { var u = new URL(location.href); st.cat === 'all' ? u.searchParams.delete('cat') : u.searchParams.set('cat', st.cat); history.replaceState(null, '', u); }
  function all() { drawTabs(); drawHero(); draw(); }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-cat]');
    if (t && t.closest('.filters')) { st.cat = t.dataset.cat; sync(); all(); }
  });
  $('#q').addEventListener('input', function (e) { st.q = e.target.value.trim(); draw(); });
  document.addEventListener('koot:lang', all);
  K.boot(); all();
  if (location.hash === '#search') $('#q').focus();
})();
</script>
</body>
</html>
