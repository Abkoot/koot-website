<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product finder · Koot</title>
<meta name="description" content="Answer three questions and get a shortlist of Koot products that fit your business.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/koot.css">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body>
<main id="main">
<section class="fd">
  <div class="wrap">
    <div class="fd-top"><span class="eyebrow" data-ar="اختر منتجك">Product finder</span><div class="fd-dots" aria-hidden="true"><i></i><i></i><i></i></div></div>
    <div class="fd-stage" aria-live="polite"></div>
  </div>
</section>
</main>
<script src="assets/products.js"></script>
<script src="assets/data.js"></script>
<script src="assets/art.js"></script>
<script src="assets/koot.js"></script>
<script src="assets/extras.js"></script>
<script>
(function () {
  var K = KOOT, stage = document.querySelector('.fd-stage'), dots = document.querySelectorAll('.fd-dots i');
  var st = { step: 0, biz: null, cats: [], pack: null };
  function T(en, ar) { return K.lang === 'ar' ? ar : en; }
  function nm(x) { return K.lang === 'ar' ? x.ar : x.en; }
  var BIZ = [
    { id: 'food', en: 'Foodservice', ar: 'خدمات الطعام', d: ['Restaurants, hotels, caterers and cloud kitchens.', 'مطاعم وفنادق وشركات تموين ومطابخ سحابية.'] },
    { id: 'retail', en: 'Retail and quick-commerce', ar: 'التجزئة والتجارة السريعة', d: ['Supermarkets, groceries and delivery apps.', 'سوبرماركت وبقالات وتطبيقات توصيل.'] },
    { id: 'import', en: 'Import and wholesale', ar: 'الاستيراد وتجارة الجملة', d: ['Importers and wholesale buyers in any market.', 'مستوردون وتجار جملة في أي سوق.'] }
  ];
  var PACK = [
    { id: 'bulk', en: 'Bulk packs', ar: 'عبوات كبيرة', d: ['2.5 kg and above.', '2.5 كجم فأكثر.'] },
    { id: 'small', en: 'Smaller packs', ar: 'عبوات أصغر', d: ['1 kg and under.', '1 كجم فأقل.'] },
    { id: 'any', en: 'No preference', ar: 'لا فرق', d: ['Show every pack size.', 'اعرض كل الأحجام.'] }
  ];
  var catPhoto = { fries: 'french-fries-9-mm-printed-2-5-kg', vegetables: 'broccoli-2-5-kg', fruits: 'strawberries-printed-2-5-kg', seafood: 'raw-peeled-shrimp-tail-off-large-1-kg', sauces: 'ketchup-5-kg', pickles: 'dill-pickles-5-kg' };
  function fits(v) { return st.pack === 'any' || (st.pack === 'bulk' ? v.unit_kg >= 2.5 : v.unit_kg <= 1); }
  function results() {
    var out = [];
    K.list.forEach(function (p) {
      if (st.cats.indexOf(p.cat) < 0) return;
      var vs = p.variants.filter(fits); if (!vs.length) return;
      if (st.biz === 'retail') vs.sort(function (a, b) { return (b.packaging === 'Printed bag') - (a.packaging === 'Printed bag') || a.unit_kg - b.unit_kg; });
      if (st.biz === 'food') vs.sort(function (a, b) { return b.unit_kg - a.unit_kg; });
      out.push({ p: p, v: vs[0] });
    });
    return out;
  }
  function why(r) {
    var v = r.v;
    if (st.biz === 'food') return v.unit_kg >= 2.5 ? T('Bulk pack sized for kitchen use.', 'عبوة كبيرة مناسبة للمطابخ.') : T('Smaller pack that is easy to portion.', 'عبوة أصغر سهلة التقسيم.');
    if (st.biz === 'retail') return T('Packed in: ', 'التعبئة: ') + K.tr(v.packaging).toLowerCase() + '.';
    return T('Origin ', 'المنشأ ') + K.tr(v.origin) + T(', shelf life ', '، مدة الصلاحية ') + K.shelf(r.p) + '.';
  }
  function opt(o, on, attr) { return '<button class="fd-opt" type="button" ' + attr + '="' + o.id + '" aria-pressed="' + on + '"><strong>' + nm(o) + '</strong><span>' + T(o.d[0], o.d[1]) + '</span></button>'; }
  function back() { return st.step ? '<button class="fd-back" type="button" data-back>' + T('Back', 'رجوع') + '</button>' : ''; }
  function draw() {
    dots.forEach(function (d, i) { d.classList.toggle('on', i <= Math.min(st.step, 2)); });
    var h;
    if (st.step === 0) h = '<div><h1>' + T('What kind of business do you run?', 'ما نوع نشاطك؟') + '</h1><div class="fd-opts">' + BIZ.map(function (o) { return opt(o, st.biz === o.id, 'data-biz'); }).join('') + '</div></div>';
    else if (st.step === 1) h = '<div><h1>' + T('What are you looking for?', 'عمّ تبحث؟') + '</h1><div class="fd-opts fd-cats">' + K.cats.map(function (c) {
      return '<button class="fd-opt" type="button" data-fcat="' + c.id + '" aria-pressed="' + (st.cats.indexOf(c.id) > -1) + '"><img src="' + K.src('assets/img/products/' + catPhoto[c.id], 600) + '" alt=""><strong>' + nm(c) + '</strong></button>';
    }).join('') + '</div><div class="fd-nav"><button class="btn" type="button" data-next' + (st.cats.length ? '' : ' disabled') + '>' + T('Next', 'التالي') + ' <span class="arr">→</span></button><button class="btn btn--ghost" type="button" data-all>' + T('Select all', 'اختر الكل') + '</button>' + back() + '</div></div>';
    else if (st.step === 2) h = '<div><h1>' + T('Which pack size suits you?', 'أي حجم عبوة يناسبك؟') + '</h1><div class="fd-opts">' + PACK.map(function (o) { return opt(o, st.pack === o.id, 'data-pack'); }).join('') + '</div><div class="fd-nav">' + back() + '</div></div>';
    else {
      var rs = results(), b = BIZ.find(function (x) { return x.id === st.biz; }), pk = PACK.find(function (x) { return x.id === st.pack; });
      h = '<div><h1>' + (rs.length ? T(rs.length + (rs.length === 1 ? ' product fits.' : ' products fit.'), rs.length + ' منتجات مناسبة.') : T('No exact match.', 'لا يوجد تطابق تام.')) + '</h1>' +
        '<div class="fd-sum"><span>' + nm(b) + '</span>' + st.cats.map(function (c) { return '<span>' + nm(K.cat(c)) + '</span>'; }).join('') + '<span>' + nm(pk) + '</span></div>' +
        (rs.length ? '<div class="fd-nav" style="margin:0 0 28px"><button class="btn btn--orange" type="button" data-addall>' + T('Add all to my selection', 'أضف الكل إلى اختياراتي') + '</button><a class="btn btn--ghost" href="catalogue.html">' + T('Build a PDF catalogue', 'أنشئ كتالوج PDF') + '</a><button class="fd-back" type="button" data-restart>' + T('Start again', 'ابدأ من جديد') + '</button></div><div class="grid">' + rs.map(function (r, i) {
          var c = K.cat(r.p.cat);
          return '<article class="pcard" style="--accent:' + c.accent + '" data-reveal="' + (i % 3 + 1) + '"><a class="pcard-art" href="product.html?p=' + r.p.id + '&v=' + r.v.sku + '"><img src="' + K.src(r.v.image, 600) + '" alt="' + r.p.en + '" loading="lazy" style="view-transition-name:pk-' + r.p.id + '"></a><div class="pcard-body"><h3><a href="product.html?p=' + r.p.id + '&v=' + r.v.sku + '">' + nm(r.p) + '</a></h3><div class="meta"><span dir="ltr">' + (K.lang === 'ar' ? r.v.pack_ar : r.v.pack) + '</span>' + (r.v.label ? '<span>' + (K.lang === 'ar' ? r.v.label_ar : r.v.label) + '</span>' : '') + '</div><p class="why">' + why(r) + '</p></div><div class="pcard-act"><button class="btn btn--sm" type="button" data-add="' + r.v.sku + '"></button></div></article>';
        }).join('') + '</div>' : '<p class="lead">' + T('Nothing in those categories comes in that pack size.', 'لا توجد منتجات في هذه الفئات بهذا الحجم.') + '</p><div class="fd-nav"><button class="btn" type="button" data-pack="any">' + T('Show every pack size', 'اعرض كل الأحجام') + '</button><button class="fd-back" type="button" data-restart>' + T('Start again', 'ابدأ من جديد') + '</button></div>') + '</div>';
    }
    stage.innerHTML = h; K.refresh(); K.reveal(stage); window.scrollTo({ top: 0 });
  }
  stage.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; var d = b.dataset;
    if (d.biz) { st.biz = d.biz; st.step = 1; }
    else if (d.fcat) { var i = st.cats.indexOf(d.fcat); i < 0 ? st.cats.push(d.fcat) : st.cats.splice(i, 1); }
    else if ('all' in d) st.cats = K.cats.map(function (c) { return c.id; });
    else if ('next' in d) st.step = 2;
    else if (d.pack) { st.pack = d.pack; st.step = 3; }
    else if ('back' in d) st.step--;
    else if ('restart' in d) st = { step: 0, biz: null, cats: [], pack: null };
    else if ('addall' in d) { results().forEach(function (r) { if (!K.has(r.v.sku)) K.add(r.v.sku); }); return; }
    else return;
    draw();
  });
  document.addEventListener('koot:lang', draw);
  K.boot(); draw();
})();
</script>
</body>
</html>
